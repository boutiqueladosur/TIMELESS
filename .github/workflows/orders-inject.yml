name: Inject order modules
on:
  push:
    branches: [orders-management]
    paths: ['.github/workflows/orders-inject.yml']
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orders-management
      - name: Inject scripts
        shell: python
        run: |
          from pathlib import Path
          for file,script in [('index.html','checkout.js'),('admin.html','orders-admin.js')]:
              p=Path(file); s=p.read_text(encoding='utf-8')
              tag=f'<script src="{script}"></script>'
              if tag not in s:
                  s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
      - name: Validate
        run: |
          node --check checkout.js
          node --check orders-admin.js
          grep -q 'checkout.js' index.html
          grep -q 'orders-admin.js' admin.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html
          git commit -m "Connect checkout and order management modules"
          git push origin HEAD:orders-management

name: Validate and complete admin panel

"on":
  push:
    branches: [admin-panel]
    paths:
      - '.github/workflows/validate-admin-panel.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin-panel
          fetch-depth: 0

      - name: Complete product and category CRUD
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
            '<div class="field"><label>Categoría</label><select id="category"></select></div>',
            '<div class="field"><label>Categoría</label><select id="category"></select><div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" id="new-category" class="btn secondary small">+ Nueva</button><button type="button" id="rename-category" class="btn secondary small">Renombrar</button><button type="button" id="delete-category" class="btn danger small">Eliminar</button></div></div>',
            1,
          )

          s=s.replace(
            '<div class="actions"><button class="icon" data-edit="${esc(p.id)}">Editar</button><button class="icon" data-toggle="${esc(p.id)}">${p.is_active?\'Ocultar\':\'Activar\'}</button></div></article>',
            '<div class="actions"><button class="icon" data-edit="${esc(p.id)}">Editar</button><button class="icon" data-toggle="${esc(p.id)}">${p.is_active?\'Ocultar\':\'Activar\'}</button><button class="icon" data-delete-product="${esc(p.id)}">Eliminar</button></div></article>',
            1,
          )

          anchor="async function toggleProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const {error}=await db.from('products').update({is_active:!p.is_active,updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast('No se pudo actualizar.');await loadAll();toast(p.is_active?'Producto ocultado.':'Producto activado.')}"
          extra="""async function deleteProduct(id){const p=products.find(x=>x.id===id);if(!p||!confirm(`¿Eliminar definitivamente ${p.name}?`))return;const paths=(p.product_images||[]).map(x=>storagePathFromUrl(x.image_url)).filter(Boolean);try{const {error}=await db.from('products').delete().eq('id',id);if(error)throw error;if(paths.length){const {error:se}=await db.storage.from(BUCKET).remove(paths);if(se)console.warn(se)}await loadAll();toast('Producto eliminado.')}catch(err){console.error(err);toast(err.message||'No se pudo eliminar el producto.')}}
async function createCategory(){const name=prompt('Nombre de la nueva categoría:')?.trim();if(!name)return;try{const max=categories.reduce((m,c)=>Math.max(m,Number(c.sort_order)||0),0);const {data,error}=await db.from('categories').insert({name,slug:slugify(name),is_active:true,sort_order:max+10}).select('id').single();if(error)throw error;await loadAll();$('category').value=data.id;toast('Categoría creada.')}catch(err){console.error(err);toast(err.message||'No se pudo crear la categoría.')}}
async function renameCategory(){const id=$('category').value;if(!id)return toast('Selecciona una categoría.');const cat=categories.find(c=>c.id===id);const name=prompt('Nuevo nombre de la categoría:',cat?.name||'')?.trim();if(!name)return;try{const {error}=await db.from('categories').update({name,slug:slugify(name),updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await loadAll();$('category').value=id;toast('Categoría renombrada.')}catch(err){console.error(err);toast(err.message||'No se pudo renombrar.')}}
async function deleteCategory(){const id=$('category').value;if(!id)return toast('Selecciona una categoría.');const cat=categories.find(c=>c.id===id);if(!confirm(`¿Eliminar la categoría ${cat?.name||''}? Los productos quedarán sin categoría.`))return;try{const {error:e1}=await db.from('products').update({category_id:null,updated_at:new Date().toISOString()}).eq('category_id',id);if(e1)throw e1;const {error:e2}=await db.from('categories').delete().eq('id',id);if(e2)throw e2;await loadAll();$('category').value='';toast('Categoría eliminada.')}catch(err){console.error(err);toast(err.message||'No se pudo eliminar la categoría.')}}"""
          if 'async function deleteProduct(id)' not in s:
              s=s.replace(anchor,anchor+'\n'+extra,1)

          s=s.replace(
            "$('product-form').addEventListener('submit',saveProduct);$('search').addEventListener('input',renderProducts);$('filter').addEventListener('change',renderProducts);",
            "$('product-form').addEventListener('submit',saveProduct);$('search').addEventListener('input',renderProducts);$('filter').addEventListener('change',renderProducts);$('new-category').addEventListener('click',createCategory);$('rename-category').addEventListener('click',renameCategory);$('delete-category').addEventListener('click',deleteCategory);",
            1,
          )
          s=s.replace(
            "const tog=e.target.closest('[data-toggle]');if(tog)return toggleProduct(tog.dataset.toggle);const pri=e.target.closest('[data-primary]');",
            "const tog=e.target.closest('[data-toggle]');if(tog)return toggleProduct(tog.dataset.toggle);const dp=e.target.closest('[data-delete-product]');if(dp)return deleteProduct(dp.dataset.deleteProduct);const pri=e.target.closest('[data-primary]');",
            1,
          )
          p.write_text(s,encoding='utf-8')

      - name: Validate admin HTML and JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re
          html=Path('admin.html').read_text(encoding='utf-8')
          required=['@supabase/supabase-js@2.118.0','signInWithPassword',"app_metadata?.role==='admin'",".from('products')",".from('product_images')",".storage.from(BUCKET).upload","const BUCKET='product-images'",'getPublicUrl','deleteProduct(id)','createCategory()','renameCategory()','deleteCategory()']
          for token in required: assert token in html, f'Missing: {token}'
          for token in ['service_role','SUPABASE_SECRET_KEY']: assert token not in html, f'Forbidden: {token}'
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/admin.js').write_text('\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          print('Static checks passed')

      - name: JavaScript syntax check
        run: node --check /tmp/admin.js

      - name: Commit completed admin panel
        run: |
          if git diff --quiet -- admin.html; then
            echo "No admin changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Complete TIMELESS admin CRUD"
          git push origin HEAD:admin-panel

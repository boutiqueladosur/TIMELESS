name: Validate shipping
on:
  push:
    branches: [shipping-logistics]
    paths: ['.github/workflows/validate-shipping.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shipping-logistics
      - run: node --check shipping-admin.js
      - run: node --check admin-tabs.js
      - run: grep -q 'data-tab="shipping"' admin-tabs.js
      - run: grep -q 'shipping_queue' shipping-admin.js
      - run: grep -q 'shipping_status' shipping-admin.js
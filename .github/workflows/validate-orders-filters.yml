name: Validate orders filters
on:
  push:
    branches: [orders-filters]
    paths: ['.github/workflows/validate-orders-filters.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orders-filters
      - run: node --check orders-admin.js
      - run: grep -q "payment-filter" orders-admin.js
      - run: grep -q "date-filter" orders-admin.js
      - run: grep -q "clear-order-filters" orders-admin.js
      - run: grep -q "orders-filter-count" orders-admin.js

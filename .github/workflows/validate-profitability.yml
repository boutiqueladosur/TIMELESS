name: Validate profitability
on:
  push:
    branches: [profitability-dashboard]
    paths: ['.github/workflows/validate-profitability.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profitability-dashboard
      - run: node --check profitability-admin.js
      - run: node --check admin-tabs.js
      - run: grep -q "product_profitability" profitability-admin.js
      - run: grep -q "Utilidad bruta estimada" profitability-admin.js
      - run: grep -q "profitability-admin.js" admin-tabs.js
name: Apply Supabase catalog migration

on:
  push:
    branches: [security-hardening]
    paths:
      - '.github/workflows/supabase-catalog-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-hardening
          fetch-depth: 0

      - name: Patch catalog source to Supabase
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '<script>\n(()=>{',
              '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n<script>\n(()=>{',
              1,
          )
          s = s.replace(
              "const SHEET='1WJKJSqb_Fq44eLWkKNOGtfrD2DW0WQmO99WQ6kWEqt8';",
              "const SUPABASE_URL='https://nfphzvcwxyfkbucwwlcx.supabase.co';\nconst SUPABASE_PUBLISHABLE_KEY='sb_publishable_DzvTmxOxVWY4LaKNqx2-xA_4RVK2TtS';\nconst supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);",
              1,
          )
          s = s.replace(
              "function safeImage(v){let s=String(v||'').trim();if(!s)return'';if(s.includes('github.com')&&s.includes('/blob/'))s=s.replace('github.com','raw.githubusercontent.com').replace('/blob/','/');try{const u=new URL(s,location.href);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}}",
              "function safeImage(v){let s=String(v||'').trim();if(!s)return'';if(s.includes('github.com')&&s.includes('/blob/'))s=s.replace('github.com','raw.githubusercontent.com').replace('/blob/','/');try{const u=new URL(s,location.href);return u.protocol==='https:'?u.href:''}catch{return''}}",
              1,
          )
          s = s.replace(
              "const pprice=p=>prop(p,['precio','price','valor']);\nconst pold=p=>prop(p,['precio_anterior','precio anterior','old_price']);\nconst pdiscount=p=>prop(p,['descuento','discount']);\nconst pcat=p=>prop(p,['categoria','categoría','tipo'])||'General';\nconst pdesc=p=>prop(p,['descripcion','descripción','detalle']);\nfunction images(p){const a=[prop(p,['imagen_1','imagen1','imagen','image','foto','url']),prop(p,['imagen_2','imagen2','foto2']),prop(p,['imagen_3','imagen3','foto3']),prop(p,['imagen_4','imagen4','foto4'])].map(safeImage).filter(Boolean);return [...new Set(a)].length?[...new Set(a)]:[PLACEHOLDER]}",
              "const pprice=p=>p.sale_price_clp??p.price_clp??prop(p,['precio','price','valor']);\nconst pold=p=>p.sale_price_clp!=null&&Number(p.sale_price_clp)<Number(p.price_clp)?p.price_clp:0;\nconst pdiscount=p=>{const old=Number(pold(p))||0,cur=Number(pprice(p))||0;return old>cur&&cur>0?`-${Math.round((1-cur/old)*100)}%`:''};\nconst pcat=p=>p.categories?.name||p.categoria||prop(p,['categoria','categoría','tipo'])||'General';\nconst pdesc=p=>p.description??prop(p,['descripcion','descripción','detalle']);\nfunction images(p){if(Array.isArray(p.product_images)&&p.product_images.length){const a=[...p.product_images].sort((x,y)=>(Number(y.is_primary)-Number(x.is_primary))||((x.sort_order||0)-(y.sort_order||0))).map(x=>safeImage(x.image_url)).filter(Boolean);if(a.length)return [...new Set(a)]}const a=[prop(p,['imagen_1','imagen1','imagen','image','foto','url']),prop(p,['imagen_2','imagen2','foto2']),prop(p,['imagen_3','imagen3','foto3']),prop(p,['imagen_4','imagen4','foto4'])].map(safeImage).filter(Boolean);return [...new Set(a)].length?[...new Set(a)]:[PLACEHOLDER]}",
              1,
          )

          start = s.index('window.handleSheetResponse=')
          end_marker = "function loadCatalog(){const s=document.createElement('script');s.src=`https://docs.google.com/spreadsheets/d/${encodeURIComponent(SHEET)}/gviz/tq?tqx=out:json;responseHandler:handleSheetResponse`;s.async=true;s.onerror=()=>{$('loader').textContent='No se pudo conectar con el catálogo.'};document.head.appendChild(s)}"
          end = s.index(end_marker, start) + len(end_marker)
          replacement = """async function loadCatalog(){
  try{
    const {data:rows,error}=await supabaseClient
      .from('products')
      .select('id,sku,name,description,price_clp,sale_price_clp,is_featured,categories(name),product_images(image_url,sort_order,is_primary)')
      .eq('is_active',true)
      .order('is_featured',{ascending:false})
      .order('name',{ascending:true});
    if(error)throw error;
    data=rows||[];
    $('loader')?.remove();
    buildCategories();
    render();
  }catch(e){
    console.error('Supabase catalog error',e);
    $('loader').textContent='No se pudo conectar con el catálogo.';
  }
}"""
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

      - name: Commit migration result
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect TIMELESS catalog to Supabase"
          git push origin HEAD:security-hardening

name: Validate purchases
on:
  push:
    branches: [purchases-module]
    paths: ['.github/workflows/validate-purchases.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: purchases-module
      - run: node --check purchases-admin.js
      - run: node --check admin-tabs.js
      - run: grep -q "data-tab=\"purchases\"" admin-tabs.js
      - run: grep -q "purchase_orders" purchases-admin.js
      - run: grep -q "received" purchases-admin.js

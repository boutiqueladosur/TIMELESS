name: Admin tabs validation

on:
  push:
    branches: [admin-tabs]
    paths: ['.github/workflows/admin-tabs-inject.yml']

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin-tabs
      - name: Inject tabs module
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="admin-tabs.js"></script>'
          if tag not in s:
              s=s.replace('<script src="orders-admin.js"></script>', '<script src="orders-admin.js"></script>\n'+tag, 1)
          assert tag in s
          p.write_text(s,encoding='utf-8')
      - name: Validate JavaScript
        run: |
          node --check admin-tabs.js
          node --check orders-admin.js
          grep -q 'admin-tabs.js' admin.html
      - name: Commit panel integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Organize admin panel into tabs"
          git push origin HEAD:admin-tabs

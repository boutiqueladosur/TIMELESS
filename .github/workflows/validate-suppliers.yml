name: Validate suppliers module
on:
  push:
    branches: [suppliers-management]
    paths: ['.github/workflows/validate-suppliers.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: suppliers-management
      - run: node --check admin-tabs.js
      - run: node --check suppliers-admin.js
      - run: node --check inventory-admin.js
      - run: grep -q 'data-tab="suppliers"' admin-tabs.js
      - run: grep -q 'data-supplier' inventory-admin.js

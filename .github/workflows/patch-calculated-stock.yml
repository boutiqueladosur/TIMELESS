name: Patch calculated stock UI
on:
  push:
    branches: [inventory-ledger-ui]
    paths: ['.github/workflows/patch-calculated-stock.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inventory-ledger-ui
      - name: Make product stock read only
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="field"><label>Stock</label><input id="stock" type="number" min="0" step="1" value="0"></div>'
          new='<div class="field"><label>Stock actual (calculado)</label><input id="stock" type="number" min="0" step="1" value="0" readonly><span class="small muted">Se modifica únicamente desde Inventario mediante movimientos.</span></div>'
          assert old in s
          s=s.replace(old,new,1)
          old_stock=",stock:Math.max(0,Math.round(Number($('stock').value)||0)),low_stock_threshold:"
          assert old_stock in s
          s=s.replace(old_stock,",low_stock_threshold:",1)
          p.write_text(s,encoding='utf-8')
      - run: node --check inventory-admin.js
      - name: Validate admin patch
        run: |
          grep -q 'Stock actual (calculado)' admin.html
          grep -q 'Se modifica únicamente desde Inventario' admin.html
          ! grep -q "stock:Math.max(0,Math.round(Number(\$('stock').value)||0))" admin.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Make product stock calculated and read only"
          git push origin HEAD:inventory-ledger-ui

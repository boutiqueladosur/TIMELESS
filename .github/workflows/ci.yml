name: TIMELESS ERP CI
on:
  push:
    branches: [main, "export/erp-independiente-20261106"]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse JavaScript modules
        run: |
          set -e
          for f in *.js; do [ -f "$f" ] && node --check "$f"; done
      - name: Run ERP regression tests
        run: node --test tests/*.test.cjs
      - name: Verify essential ERP modules
        run: |
          test -f admin.html
          test -f admin-tabs.js
          test -f mfa-admin.js
          test -f purchases-admin.js
          test -f orders-admin.js
          test -f inventory-admin.js
      - name: Prevent server secrets in frontend
        run: |
          if grep -R -n -E 'SUPABASE_SERVICE_ROLE_KEY|service_role' --include='*.js' --include='*.html' . --exclude-dir=supabase --exclude-dir=.git; then exit 1; fi

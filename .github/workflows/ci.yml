name: TIMELESS Catalog CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "refactor/catalogo-simple-20261106"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in *.js; do [ -f "$f" ] && node --check "$f"; done
      - name: Catalog regression tests
        run: node --test tests/*.test.cjs
      - name: Validate required files
        run: |
          test -f index.html
          test -f admin.html
          test -f checkout.js
          test -f security-admin.js
          test -f session-idle.js
          test -f supabase/functions/create-order/index.ts
      - name: Prevent server secrets in public frontend
        run: |
          if grep -R -n -E 'SUPABASE_SERVICE_ROLE_KEY|service_role' --include='*.js' --include='*.html' . --exclude-dir=supabase --exclude-dir=.git; then exit 1; fi

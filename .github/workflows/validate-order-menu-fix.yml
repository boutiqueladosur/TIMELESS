name: Validate order history and dropdown menu
on:
  push:
    branches: [fix-order-history-dropdown-menu]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-order-history-dropdown-menu
      - run: node --check admin-tabs.js
      - run: node --check orders-auth-sync.js
      - run: grep -q "orders-auth-sync.js" admin-tabs.js
      - run: grep -q "admin-section-select" admin-tabs.js
      - run: grep -q "getAuthenticatorAssuranceLevel" orders-auth-sync.js

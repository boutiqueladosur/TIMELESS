<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7f2">
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, noimageindex">
  <meta name="description" content="TIMELESS TCO está preparando su próxima apertura.">
  <title>TIMELESS TCO · Próximamente</title>
  <link rel="icon" href="assets/timeless-mariposa.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 22px;background:#faf7f2;color:#201812;font-family:Arial,Helvetica,sans-serif}
    main{width:min(600px,100%);text-align:center}
    .mark{width:110px;height:110px;object-fit:contain;margin-bottom:25px}
    .eyebrow{display:block;color:#986d39;letter-spacing:.27em;font-weight:700;font-size:11px;margin-bottom:18px}
    h1{font:normal clamp(48px,10vw,80px)/1.08 Georgia,"Times New Roman",serif;letter-spacing:-.035em;margin:0 0 20px}
    .divider{width:92px;height:1px;background:#b9966b;margin:0 auto 25px}
    p{font-size:15px;line-height:1.85;color:#6c5c50;max-width:460px;margin:0 auto}
    footer{margin-top:65px;color:#8f8075;font-size:11px;letter-spacing:.16em}
  </style>
</head>
<body>
  <main>
    <img class="mark" src="assets/timeless-mariposa.svg" alt="Emblema de TIMELESS TCO">
    <span class="eyebrow">TIMELESS TCO</span>
    <h1>Próximamente.</h1>
    <div class="divider" aria-hidden="true"></div>
    <p>Estamos preparando una nueva experiencia para ti. Nuestra tienda en línea estará disponible próximamente.</p>
  </main>
  <footer>TIMELESS · CARTERAS Y ACCESORIOS</footer>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIMELESS · Administración</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#171717;--muted:#6b6b6b;--line:#e7e1da;--gold:#b38b4a;--danger:#a12d2d;--ok:#1f6b45;--shadow:0 14px 40px rgba(0,0,0,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.shell{max-width:1240px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#111;color:#fff;font-weight:800}.brand h1{font-size:20px;margin:0}.brand small{color:var(--muted)}.btn{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:700}.btn.primary{background:#111;color:#fff}.btn.secondary{background:#eee8e0}.btn.danger{background:#fff1f1;color:var(--danger)}.btn.gold{background:var(--gold);color:#fff}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:28px}.login-card h1{margin:0 0 8px}.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#b6aa9e;box-shadow:0 0 0 3px rgba(179,139,74,.12)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.stat strong{display:block;font-size:26px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}.products{display:grid;gap:12px}.row{display:grid;grid-template-columns:74px 1.4fr .8fr .7fr .6fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.thumb{width:74px;height:74px;border-radius:12px;object-fit:cover;background:#eee}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;background:#f0ece7}.pill.ok{background:#e9f6ef;color:var(--ok)}.pill.off{background:#f4eaea;color:#7b3333}.actions{display:flex;gap:8px}.icon{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;cursor:pointer}.empty{padding:30px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(900px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head h2{margin:0}.checkline{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}.checkline label{display:flex;gap:8px;align-items:center}.drop{border:2px dashed #d8cec3;border-radius:16px;padding:18px;text-align:center;background:#fbfaf8}.drop input{margin-top:10px}.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;margin-top:14px}.img-card{border:1px solid var(--line);border-radius:14px;padding:8px;background:#fff}.img-card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px}.img-actions{display:grid;gap:6px;margin-top:8px}.small{font-size:12px}.notice{padding:11px 13px;border-radius:12px;background:#fff8e8;border:1px solid #eed9a7;margin:12px 0}.toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:40}.toast.show{opacity:1;transform:none}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:64px 1fr auto}.row>:nth-child(3),.row>:nth-child(4),.row>:nth-child(5){display:none}.grid{grid-template-columns:1fr}}@media(max-width:520px){.shell{padding:16px}.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.actions{flex-direction:column}}
</style>
</head>
<body>
<div id="login-view" class="login-wrap">
  <form id="login-form" class="login-card">
    <div class="brand"><div class="mark">T</div><div><h1>TIMELESS Admin</h1><small>Acceso restringido</small></div></div>
    <p class="muted">Ingresa con la cuenta administradora de Supabase.</p>
    <div class="field"><label>Email</label><input id="login-email" type="email" autocomplete="username" required></div>
    <div class="field"><label>Contraseña</label><input id="login-password" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" style="width:100%" type="submit">Ingresar</button>
    <div id="login-error" class="notice hidden"></div>
  </form>
</div>

<div id="app-view" class="hidden">
  <main class="shell">
    <div class="top"><div class="brand"><div class="mark">T</div><div><h1>Panel de administración</h1><small id="admin-email"></small></div></div><div style="display:flex;gap:8px"><a class="btn secondary" href="index.html" target="_blank" rel="noopener">Ver tienda</a><button id="logout" class="btn secondary">Salir</button></div></div>
    <section class="stats"><div class="stat"><span class="muted small">Productos</span><strong id="stat-products">0</strong></div><div class="stat"><span class="muted small">Activos</span><strong id="stat-active">0</strong></div><div class="stat"><span class="muted small">Stock total</span><strong id="stat-stock">0</strong></div><div class="stat"><span class="muted small">Stock bajo</span><strong id="stat-low">0</strong></div></section>
    <div class="toolbar"><button id="new-product" class="btn gold">+ Nuevo producto</button><input id="search" placeholder="Buscar producto o SKU"><select id="filter"><option value="all">Todos</option><option value="active">Activos</option><option value="inactive">Inactivos</option><option value="low">Stock bajo</option></select></div>
    <section id="products" class="products"></section>
  </main>
</div>

<div id="editor" class="overlay hidden">
  <form id="product-form" class="modal">
    <div class="modal-head"><h2 id="editor-title">Nuevo producto</h2><button type="button" id="close-editor" class="icon">✕</button></div>
    <input id="product-id" type="hidden">
    <div class="grid">
      <div class="field"><label>Nombre *</label><input id="name" maxlength="120" required></div>
      <div class="field"><label>SKU *</label><input id="sku" maxlength="60" required></div>
      <div class="field"><label>Categoría</label><select id="category"></select></div>
      <div class="field"><label>Stock</label><input id="stock" type="number" min="0" step="1" value="0"></div>
      <div class="field"><label>Precio normal CLP *</label><input id="price" type="number" min="0" step="1" required></div>
      <div class="field"><label>Precio oferta CLP</label><input id="sale-price" type="number" min="0" step="1"></div>
      <div class="field"><label>Material</label><input id="material" maxlength="100"></div>
      <div class="field"><label>Color</label><input id="color" maxlength="80"></div>
    </div>
    <div class="field"><label>Descripción</label><textarea id="description" rows="4" maxlength="1200"></textarea></div>
    <div class="checkline"><label><input id="is-active" type="checkbox" checked> Producto activo</label><label><input id="is-featured" type="checkbox"> Destacado</label></div>
    <div class="field"><label>Alerta de stock bajo</label><input id="low-threshold" type="number" min="0" step="1" value="3"></div>
    <div class="drop"><strong>Imágenes del producto</strong><div class="muted small">JPEG, PNG, WEBP o AVIF · máximo 10 MB por archivo</div><input id="images" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple></div>
    <div id="existing-images" class="image-grid"></div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px"><button type="button" id="cancel-editor" class="btn secondary">Cancelar</button><button id="save-product" class="btn primary" type="submit">Guardar producto</button></div>
  </form>
</div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script>
(()=>{
'use strict';
const SUPABASE_URL='https://nfphzvcwxyfkbucwwlcx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_DzvTmxOxVWY4LaKNqx2-xA_4RVK2TtS';
const BUCKET='product-images';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
let products=[],categories=[],editing=null,toastTimer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Number(v)||0);
const slugify=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,100);
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2400)}
function adminRole(user){return user?.app_metadata?.role==='admin'}
async function ensureAdmin(){const {data:{session}}=await db.auth.getSession();if(!session){showLogin();return false}const {data:{user},error}=await db.auth.getUser();if(error||!adminRole(user)){await db.auth.signOut();showLogin('Esta cuenta no tiene permisos de administrador.');return false}$('admin-email').textContent=user.email||'Administrador';$('login-view').classList.add('hidden');$('app-view').classList.remove('hidden');await loadAll();return true}
function showLogin(msg=''){$('app-view').classList.add('hidden');$('login-view').classList.remove('hidden');$('login-error').classList.toggle('hidden',!msg);$('login-error').textContent=msg}
async function loadAll(){const [pc,cc]=await Promise.all([db.from('products').select('id,category_id,sku,slug,name,description,price_clp,sale_price_clp,stock,low_stock_threshold,is_active,is_featured,material,color,product_images(id,image_url,sort_order,is_primary)').order('created_at',{ascending:false}),db.from('categories').select('id,name,is_active,sort_order').order('sort_order')]);if(pc.error)throw pc.error;if(cc.error)throw cc.error;products=pc.data||[];categories=cc.data||[];renderCategories();renderProducts()}
function renderCategories(){$('category').innerHTML='<option value="">Sin categoría</option>'+categories.filter(c=>c.is_active).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}
function filtered(){const q=$('search').value.toLowerCase().trim(),f=$('filter').value;return products.filter(p=>{const text=`${p.name} ${p.sku}`.toLowerCase();const low=(p.stock??0)<=(p.low_stock_threshold??3);return(!q||text.includes(q))&&(f==='all'||(f==='active'&&p.is_active)||(f==='inactive'&&!p.is_active)||(f==='low'&&low))})}
function primaryImage(p){const imgs=[...(p.product_images||[])].sort((a,b)=>(Number(b.is_primary)-Number(a.is_primary))||((a.sort_order||0)-(b.sort_order||0)));return imgs[0]?.image_url||'cartera1234.png'}
function renderProducts(){const list=filtered();$('stat-products').textContent=products.length;$('stat-active').textContent=products.filter(p=>p.is_active).length;$('stat-stock').textContent=products.reduce((s,p)=>s+(Number(p.stock)||0),0);$('stat-low').textContent=products.filter(p=>(p.stock??0)<=(p.low_stock_threshold??3)).length;$('products').innerHTML=list.length?list.map(p=>`<article class="row"><img class="thumb" src="${esc(primaryImage(p))}" alt=""><div><strong>${esc(p.name)}</strong><div class="muted small">${esc(p.sku)}</div></div><div>${money(p.sale_price_clp??p.price_clp)}${p.sale_price_clp?`<div class="muted small"><s>${money(p.price_clp)}</s></div>`:''}</div><div>Stock: <strong>${Number(p.stock)||0}</strong></div><div><span class="pill ${p.is_active?'ok':'off'}">${p.is_active?'Activo':'Inactivo'}</span></div><div class="actions"><button class="icon" data-edit="${esc(p.id)}">Editar</button><button class="icon" data-toggle="${esc(p.id)}">${p.is_active?'Ocultar':'Activar'}</button></div></article>`).join(''):'<div class="empty">No hay productos que coincidan.</div>'}
function openEditor(p=null){editing=p;$('editor-title').textContent=p?'Editar producto':'Nuevo producto';$('product-id').value=p?.id||'';$('name').value=p?.name||'';$('sku').value=p?.sku||'';$('category').value=p?.category_id||'';$('stock').value=p?.stock??0;$('price').value=p?.price_clp??'';$('sale-price').value=p?.sale_price_clp??'';$('material').value=p?.material||'';$('color').value=p?.color||'';$('description').value=p?.description||'';$('is-active').checked=p?.is_active??true;$('is-featured').checked=p?.is_featured??false;$('low-threshold').value=p?.low_stock_threshold??3;$('images').value='';renderImages(p);$('editor').classList.remove('hidden')}
function closeEditor(){$('editor').classList.add('hidden');editing=null}
function renderImages(p){const imgs=[...(p?.product_images||[])].sort((a,b)=>(Number(b.is_primary)-Number(a.is_primary))||((a.sort_order||0)-(b.sort_order||0)));$('existing-images').innerHTML=imgs.map(img=>`<div class="img-card"><img src="${esc(img.image_url)}" alt=""><div class="img-actions">${img.is_primary?'<span class="pill ok">Principal</span>':`<button type="button" class="btn secondary small" data-primary="${esc(img.id)}">Hacer principal</button>`}<button type="button" class="btn danger small" data-delete-image="${esc(img.id)}">Eliminar imagen</button></div></div>`).join('')}
function storagePathFromUrl(url){const marker=`/storage/v1/object/public/${BUCKET}/`;const i=String(url).indexOf(marker);return i>=0?decodeURIComponent(String(url).slice(i+marker.length)):null}
async function saveProduct(e){e.preventDefault();const name=$('name').value.trim(),sku=$('sku').value.trim();const price=Number($('price').value),sale=$('sale-price').value===''?null:Number($('sale-price').value);if(!name||!sku||!Number.isFinite(price)||price<0)return toast('Revisa nombre, SKU y precio.');if(sale!=null&&(sale<0||sale>price))return toast('El precio oferta debe ser menor o igual al normal.');const payload={name,sku,slug:slugify(name)+'-'+slugify(sku),category_id:$('category').value||null,description:$('description').value.trim()||null,price_clp:Math.round(price),sale_price_clp:sale==null?null:Math.round(sale),stock:Math.max(0,Math.round(Number($('stock').value)||0)),low_stock_threshold:Math.max(0,Math.round(Number($('low-threshold').value)||0)),is_active:$('is-active').checked,is_featured:$('is-featured').checked,material:$('material').value.trim()||null,color:$('color').value.trim()||null,updated_at:new Date().toISOString()};$('save-product').disabled=true;try{let id=editing?.id;if(id){const {error}=await db.from('products').update(payload).eq('id',id);if(error)throw error}else{const {data,error}=await db.from('products').insert(payload).select('id').single();if(error)throw error;id=data.id}const files=[...$('images').files];if(files.length)await uploadImages(id,files);toast('Producto guardado.');closeEditor();await loadAll()}catch(err){console.error(err);toast(err.message||'No se pudo guardar.')}finally{$('save-product').disabled=false}}
async function uploadImages(productId,files){const current=products.find(p=>p.id===productId)?.product_images||[];let order=current.length;for(const file of files){if(file.size>10*1024*1024)throw new Error(`${file.name}: supera 10 MB`);if(!['image/jpeg','image/png','image/webp','image/avif'].includes(file.type))throw new Error(`${file.name}: formato no permitido`);const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${productId}/${crypto.randomUUID()}.${ext}`;const {error:upErr}=await db.storage.from(BUCKET).upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});if(upErr)throw upErr;const {data:urlData}=db.storage.from(BUCKET).getPublicUrl(path);const {error:rowErr}=await db.from('product_images').insert({product_id:productId,image_url:urlData.publicUrl,sort_order:order,is_primary:current.length===0&&order===0,alt_text:$('name').value.trim()});if(rowErr){await db.storage.from(BUCKET).remove([path]);throw rowErr}order++}}
async function setPrimary(imageId){if(!editing)return;try{const {error:e1}=await db.from('product_images').update({is_primary:false}).eq('product_id',editing.id);if(e1)throw e1;const {error:e2}=await db.from('product_images').update({is_primary:true}).eq('id',imageId);if(e2)throw e2;await loadAll();editing=products.find(p=>p.id===editing.id);renderImages(editing);toast('Imagen principal actualizada.')}catch(err){console.error(err);toast('No se pudo cambiar la imagen principal.')}}
async function deleteImage(imageId){if(!editing)return;const img=(editing.product_images||[]).find(x=>x.id===imageId);if(!img||!confirm('¿Eliminar esta imagen?'))return;try{const path=storagePathFromUrl(img.image_url);const {error}=await db.from('product_images').delete().eq('id',imageId);if(error)throw error;if(path){const {error:se}=await db.storage.from(BUCKET).remove([path]);if(se)console.warn(se)}await loadAll();editing=products.find(p=>p.id===editing.id);if(editing&&editing.product_images?.length&&!editing.product_images.some(x=>x.is_primary)){const first=[...editing.product_images].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))[0];await db.from('product_images').update({is_primary:true}).eq('id',first.id);await loadAll();editing=products.find(p=>p.id===editing.id)}renderImages(editing);toast('Imagen eliminada.')}catch(err){console.error(err);toast('No se pudo eliminar la imagen.')}}
async function toggleProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const {error}=await db.from('products').update({is_active:!p.is_active,updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast('No se pudo actualizar.');await loadAll();toast(p.is_active?'Producto ocultado.':'Producto activado.')}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();$('login-error').classList.add('hidden');const {error}=await db.auth.signInWithPassword({email:$('login-email').value.trim(),password:$('login-password').value});if(error)return showLogin('Email o contraseña incorrectos.');await ensureAdmin()});
$('logout').addEventListener('click',async()=>{await db.auth.signOut();showLogin()});$('new-product').addEventListener('click',()=>openEditor());$('close-editor').addEventListener('click',closeEditor);$('cancel-editor').addEventListener('click',closeEditor);$('product-form').addEventListener('submit',saveProduct);$('search').addEventListener('input',renderProducts);$('filter').addEventListener('change',renderProducts);
document.addEventListener('click',e=>{const edit=e.target.closest('[data-edit]');if(edit)return openEditor(products.find(p=>p.id===edit.dataset.edit));const tog=e.target.closest('[data-toggle]');if(tog)return toggleProduct(tog.dataset.toggle);const pri=e.target.closest('[data-primary]');if(pri)return setPrimary(pri.dataset.primary);const del=e.target.closest('[data-delete-image]');if(del)return deleteImage(del.dataset.deleteImage)});
$('editor').addEventListener('click',e=>{if(e.target===$('editor'))closeEditor()});
ensureAdmin().catch(err=>{console.error(err);showLogin('No se pudo conectar con Supabase.')});
})();
</script>
</body>
</html>
